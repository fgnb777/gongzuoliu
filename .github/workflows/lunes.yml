name: lunes-AutoLogin

on:
  schedule:
    # 每 7 天一次
    # UTC 18:03（北京时间 02:03）
    - cron: "03 18 */7 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ✅ 检出私库 lunes.host-baohuo
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: fgnb777/lunes.host-baohuo
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: .

      - name: Debug - Show repo structure
        run: |
          echo "📁 当前目录: $(pwd)"
          echo "📂 文件列表:"
          ls -la
          echo ""
          echo "📂 查找所有 .py 文件:"
          find . -name "*.py" -type f

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            chromium-browser \
            fonts-noto-cjk \
            x11-utils \
            xdotool \
            scrot
          pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt -q
          else
            pip install DrissionPage requests pyvirtualdisplay
          fi

      - name: Run lunes login script
        env:
          LUNES_ACCOUNTS_BATCH: ${{ secrets.LUNES_ACCOUNTS_BATCH }}
          HEADLESS: "true"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "🔐 开始执行登录脚本..."
          echo "当前目录: $(pwd)"
          
          # 检查 main.py 是否存在
          if [ -f "main.py" ]; then
            echo "✅ 找到 main.py"
            xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python main.py
          else
            echo "❌ 未找到 main.py"
            echo "当前目录内容:"
            ls -la
            exit 1
          fi

      - name: Upload debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lunes-debug
          path: |
            *.html
            *.log
            screenshots/**
          if-no-files-found: ignore
