name: lunes-AutoLogin

on:
  schedule:
    # 每 7 天一次
    # UTC 18:03（北京时间 02:03）
    - cron: "03 18 */7 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ✅ 检出私库 lunes.host-baohuo
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: fgnb777/lunes.host-baohuo
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: scripts

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 📦 系统依赖 + Python 依赖
      - name: Install dependencies
        working-directory: scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            chromium-browser \
            fonts-noto-cjk \
            x11-utils \
            xdotool \
            scrot
          pip install --upgrade pip
          pip install -r requirements.txt -q

      # 🚀 执行登录脚本
      - name: Run lunes login script
        working-directory: scripts
        env:
          LUNES_ACCOUNTS_BATCH: ${{ secrets.LUNES_ACCOUNTS_BATCH }}
          HEADLESS: "true"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # 如果使用硬编码账号，可以不用 LUNES_ACCOUNTS_BATCH
          # 但如果需要从环境变量读取，就保留
          echo "🔐 开始执行登录脚本..."
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python login.py

      # 📦 上传调试文件（即使失败也上传）
      - name: Upload debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lunes-debug
          path: |
            scripts/*.html
            scripts/screenshots/**
          if-no-files-found: ignore
