name: LunesHost Auto Login

on:
  schedule:
    - cron: '0 12 */3 * *'
  workflow_dispatch:

jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: fgnb777/lunes.host-baohuo
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: scripts

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        working-directory: scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk
          pip install -r requirements.txt
          seleniumbase install chromedriver

      # ============================================================
      # 安装 gost（SOCKS5 → HTTP 代理转换）
      # ============================================================
      - name: Install gost
        run: |
          wget -q https://github.com/ginuerzh/gost/releases/download/v2.11.5/gost-linux-amd64-2.11.5.gz
          gunzip gost-linux-amd64-2.11.5.gz
          chmod +x gost-linux-amd64-2.11.5
          sudo mv gost-linux-amd64-2.11.5 /usr/local/bin/gost

      # ============================================================
      # 启动 gost 将 SOCKS5 转为 HTTP 代理
      # ============================================================
      - name: Start gost proxy
        run: |
          # SOCKS5 代理信息
          SOCKS5_URL="socks5://cd648a45:30ee9a73da99@130.193.96.121:24169"
          
          # 启动 gost，将 SOCKS5 转为本地 HTTP 代理（端口 1080）
          nohup gost -L=:1080 -F="$SOCKS5_URL" > /tmp/gost.log 2>&1 &
          sleep 5
          
          echo "✅ Gost 代理已启动"
          echo "📍 SOCKS5 → HTTP 代理: http://127.0.0.1:1080"
          
          # 验证代理是否运行
          ps aux | grep gost | grep -v grep || echo "⚠️ gost 可能未运行"
          netstat -tlnp | grep 1080 || echo "⚠️ 端口 1080 未监听"

      # ============================================================
      # 运行登录脚本
      # ============================================================
      - name: Run login script
        working-directory: scripts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HEADLESS: "true"
          # 使用 gost 转换后的 HTTP 代理
          IS_PROXY: "true"
          PROXY_SERVER: "http://127.0.0.1:1080"
        run: |
          echo "🔗 使用代理: http://127.0.0.1:1080"
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python main.py

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ github.run_number }}
          path: scripts/screenshots/
          retention-days: 7
          if-no-files-found: warn
