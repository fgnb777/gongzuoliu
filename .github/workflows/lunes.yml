name: lunes

on:
  # 每周五 UTC 12:00 运行（北京时间 20:00）
  schedule:
    - cron: '0 12 * * 5'
  # 手动触发
  workflow_dispatch:

jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: fgnb777/lunes.host-baohuo
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-repo

      - name: Debug - List directory structure
        run: |
          echo "Current directory: $(pwd)"
          echo "Contents of current directory:"
          ls -la
          echo "Contents of private-repo directory:"
          ls -la private-repo/ || echo "private-repo directory not found"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        working-directory: private-repo
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk jq wget
          # 检查是否存在 requirements.txt
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          else
            echo "requirements.txt not found, installing default packages"
            pip install selenium seleniumbase python-telegram-bot pysocks
          fi
          seleniumbase install chromedriver

      - name: Install gost (proxy converter)
        run: |
          wget -q https://github.com/ginuerzh/gost/releases/download/v2.11.5/gost-linux-amd64-2.11.5.gz
          gunzip gost-linux-amd64-2.11.5.gz
          chmod +x gost-linux-amd64-2.11.5
          sudo mv gost-linux-amd64-2.11.5 /usr/local/bin/gost

      - name: Start gost proxy
        env:
          SOCKS_PROXY_URL: "socks5://cd648a45:30ee9a73da99@130.193.96.121:24169"
        run: |
          # 启动 gost 将 SOCKS5 转换为 HTTP 代理
          nohup gost -L=:1080 -F="$SOCKS_PROXY_URL" > /tmp/gost.log 2>&1 &
          sleep 5
          echo "Gost proxy started on 127.0.0.1:1080"
          # 验证 gost 是否运行
          ps aux | grep gost || echo "Warning: gost may not be running"
          netstat -tlnp | grep 1080 || echo "Port 1080 not found"

      - name: Find and run login script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IS_PROXY: "true"
          PROXY_SERVER: "http://127.0.0.1:1080"
          HEADLESS: "false"
        run: |
          # 查找 main.py 文件的位置
          echo "Looking for main.py in private-repo:"
          find private-repo -name "main.py" -type f
          
          # 获取 main.py 所在的目录
          MAIN_DIR=$(find private-repo -name "main.py" -type f -exec dirname {} \; | head -1)
          
          if [ -z "$MAIN_DIR" ]; then
            echo "Error: main.py not found in private-repo"
            echo "Listing all files in private-repo:"
            find private-repo -type f
            exit 1
          fi
          
          echo "Found main.py in: $MAIN_DIR"
          echo "Contents of $MAIN_DIR:"
          ls -la "$MAIN_DIR"
          
          # 切换到 main.py 所在目录并运行
          cd "$MAIN_DIR"
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python main.py

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ github.run_number }}
          path: private-repo/**/screenshots/
          retention-days: 7
          if-no-files-found: warn
