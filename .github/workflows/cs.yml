name: Katabump Auto Renew

on:
  schedule:
    # 每天 UTC 时间 2:00 运行（北京时间 10:00）
    - cron: '0 2 * * *'
  workflow_dispatch:  # 支持手动触发

jobs:
  renew:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: fgnb777/cs
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: scripts
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        working-directory: scripts
        run: |
          python -m pip install --upgrade pip
          pip install camoufox playwright requests
          playwright install chromium
          python -m camoufox fetch
      
      - name: Run renew script
        working-directory: scripts
        env:
          # 优先使用 Cookies（推荐）
          KATABUMP_COOKIES: ${{ secrets.KATABUMP_COOKIES }}
          # 备用：邮箱密码
          KATABUMP_MAIL: ${{ secrets.KATABUMP_MAIL }}
          KATABUMP_PASS: ${{ secrets.KATABUMP_PASS }}
          # Telegram 通知
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # CI 环境标识
          CI: "true"
          # GitHub Actions 信息
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python main.py
      
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ github.run_id }}
          path: scripts/screenshots/
          retention-days: 7
